<!DOCTYPE html>

{% load static %}

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../theme/output.css">
    <title>{% block title %}  {% endblock title %}</title>
</head>

<body>

    <!-- HEADER -->
    <header class="sticky top-0 z-50 border-b border-zinc-800 bg-zinc-950/90 backdrop-blur">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
            <!-- Title + Navbar -->
            <div class="flex items-center gap-12">
                <a href="#" 
                   class="text-xl font-heading font-bold tracking-wide">
                    HARDWARE<span class="text-blue-600"> |::| BASE</span>
                </a>
                <nav class="hidden md:flex items-center gap-8 text-sm font-text font-medium">
                    <a href="#" class="text-blue-500">Home</a>
                    <a href="#" class="text-zinc-400 transition hover:text-amber-400">Build PC</a>
                    <a href="#" class="text-zinc-400 transition hover:text-amber-400">Components</a>
                    <a href="#" class="text-zinc-400 transition hover:text-amber-400">Games</a>
                    <a href="#" class="text-zinc-400 transition hover:text-amber-400">Compare</a>
                </nav>
            </div>
            <!-- Auth - Sign In and Sign Up -->
            <div class="flex items-center gap-4">
                <a href="#"
                   class="rounded-lg bg-blue-600 hover:bg-blue-500 px-4 py-2 text-sm font-heading font-medium transition">
                    Sign In
                </a>
                <a href="#"
                   class="rounded-lg px-4 py-2 text-sm hover:text-amber-400 font-heading font-medium transition">
                    Sign Up
                </a>
            </div>
        </div>
    </header>

    <main>
        {% block content %} {% endblock content %}
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-zinc-800 py-10">
        <div class="mx-auto flex max-w-7xl flex-col gap-6 px-6 md:flex-row md:items-center md:justify-between">
            <div>
                <h3 class="font-heading font-bold">
                    &copy; HardwareBase
                </h3>
                <p class="mt-2 text-sm text-zinc-500 font-text">
                    High Performance Engineering.
                </p>
            </div>
            <nav class="flex flex-wrap gap-6 text-sm text-zinc-500 font-text">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Support</a>
                <a href="#">API Docs</a>
            </nav>
        </div>
    </footer>

</body>

</html>
